name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and Prepare Mobile Project
        run: |
          curl -L -o JMSMSGatewayMobile.zip "https://ais-pre-qojukadojgnkvmgigdbkwv-11157694082.europe-west2.run.app/JMSMSGatewayMobile.zip"
          unzip -o JMSMSGatewayMobile.zip
          if [ -d "JMSMSGatewayMobile/app" ]; then
            cp -r JMSMSGatewayMobile/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM-SMS-Gateway-Mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
